<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn hàng — TechStore</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="header-placeholder"></div>

<div class="container-fluid px-md-5 main-content">
    <h1 class="cps-title mt-3 mb-4"><i class="fas fa-clipboard-list"></i> Đơn hàng của tôi</h1>

    <div id="orders-loading" class="text-center py-5">
        <div class="spinner-border text-danger"></div><p class="mt-2 text-muted">Đang tải đơn hàng...</p>
    </div>

    <div id="orders-empty" style="display:none;" class="text-center p-5 bg-white rounded">
        <i class="fas fa-clipboard fa-3x text-muted mb-3"></i>
        <p class="text-muted">Bạn chưa có đơn hàng nào.</p>
        <a href="index.html" class="btn-primary-red" style="display:inline-block;width:auto;padding:10px 28px;border-radius:8px;text-decoration:none;">
            <i class="fas fa-store mr-2"></i>Mua sắm ngay
        </a>
    </div>

    <div id="orders-list" style="display:none;"></div>
</div>

<!-- Modal chi tiết đơn hàng -->
<div class="modal fade" id="orderDetailModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content" style="border-radius:14px;">
            <div class="modal-header">
                <h5 class="modal-title font-weight-700" id="modal-order-title">Chi tiết đơn hàng</h5>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body" id="modal-order-body"></div>
        </div>
    </div>
</div>

<div id="footer-placeholder"></div>
<div id="toast-container"></div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/components.js"></script>
<script>
var STATUS_LABELS = {
    pending:   '<span class="badge badge-pending px-2 py-1">Chờ xác nhận</span>',
    confirmed: '<span class="badge badge-confirmed px-2 py-1">Đã xác nhận</span>',
    shipping:  '<span class="badge badge-shipping px-2 py-1">Đang giao</span>',
    delivered: '<span class="badge badge-delivered px-2 py-1">Đã giao</span>',
    cancelled: '<span class="badge badge-cancelled px-2 py-1">Đã hủy</span>',
};
var PAYMENT_LABELS = { cod: 'COD (Khi nhận hàng)', bank_transfer: 'Chuyển khoản', e_wallet: 'Ví điện tử' };

$(document).ready(function () {
    if (!Auth.requireLogin()) return;
    Components.loadHeader();
    Components.loadFooter();
    loadOrders();
});

function loadOrders() {
    API.authGet('/api/orders').done(function (res) {
        $('#orders-loading').hide();
        var orders = res.data ? (res.data.orders || res.data) : [];
        if (!res.success || !orders || orders.length === 0) {
            $('#orders-empty').show(); return;
        }
        renderOrders(orders);
    }).fail(function () {
        $('#orders-loading').hide();
        Toast.error('Không thể tải đơn hàng.');
    });
}

function renderOrders(orders) {
    var container = $('#orders-list').empty().show();
    $.each(orders, function (i, o) {
        var statusBadge = STATUS_LABELS[o.status] || o.status;
        var payMethod   = PAYMENT_LABELS[o.payment_method] || o.payment_method;
        var canCancel   = (o.status === 'pending' || o.status === 'confirmed') && !Auth.isAdmin();

        var card = $('<div class="page-card mb-3">'
            + '<div class="d-flex flex-wrap justify-content-between align-items-start mb-3">'
            + '<div>'
            + '<h6 class="font-weight-700 mb-1">Đơn hàng <span style="color:#d70018;">#' + o.id + '</span></h6>'
            + '<small class="text-muted"><i class="far fa-clock mr-1"></i>' + (o.created_at || '') + '</small>'
            + '</div>'
            + '<div class="text-right">'
            + statusBadge
            + '</div></div>'
            + '<div class="row text-sm">'
            + '<div class="col-sm-4 mb-2"><i class="fas fa-user text-muted mr-1"></i><strong>' + escHtml(o.fullname || '') + '</strong></div>'
            + '<div class="col-sm-4 mb-2"><i class="fas fa-phone text-muted mr-1"></i>' + escHtml(o.phone || '') + '</div>'
            + '<div class="col-sm-4 mb-2"><i class="fas fa-map-marker-alt text-muted mr-1"></i>' + escHtml(o.address || '') + '</div>'
            + '</div>'
            + '<div class="d-flex justify-content-between align-items-center mt-3 pt-3" style="border-top:1px dashed #f0f0f0;">'
            + '<div>'
            + '<span class="text-muted mr-2">Thanh toán: <strong>' + payMethod + '</strong></span>'
            + '</div>'
            + '<div class="d-flex align-items-center" style="gap:10px;">'
            + '<span style="color:#d70018;font-weight:700;font-size:1.1rem;">' + numberFormat(o.total_amount) + ' ₫</span>'
            + '<button class="btn btn-sm btn-outline-secondary btn-view-order" data-id="' + o.id + '"><i class="fas fa-eye mr-1"></i>Chi tiết</button>'
            + (canCancel ? '<button class="btn btn-sm btn-outline-danger btn-cancel-order" data-id="' + o.id + '"><i class="fas fa-times mr-1"></i>Hủy</button>' : '')
            + '</div></div></div>');

        container.append(card);
    });

    // Xem chi tiết
    container.on('click', '.btn-view-order', function () {
        showOrderDetail($(this).data('id'));
    });

    // Hủy đơn
    container.on('click', '.btn-cancel-order', function () {
        var id = $(this).data('id');
        if (!confirm('Bạn có chắc muốn hủy đơn hàng #' + id + '?')) return;
        API.authDelete('/api/orders/' + id).done(function (res) {
            if (res.success) { Toast.success('Đã hủy đơn hàng.'); loadOrders(); }
            else Toast.error(res.message);
        });
    });
}

function showOrderDetail(id) {
    $('#modal-order-title').text('Chi tiết đơn hàng #' + id);
    $('#modal-order-body').html('<div class="text-center py-4"><div class="spinner-border text-danger"></div></div>');
    $('#orderDetailModal').modal('show');

    API.authGet('/api/orders/' + id).done(function (res) {
        if (!res.success) { $('#modal-order-body').html('<p class="text-danger">Không tải được.</p>'); return; }
        var o = res.data.order;
        var items = res.data.items || [];

        var itemsHtml = '';
        $.each(items, function (i, item) {
            itemsHtml += '<tr><td>' + escHtml(item.product_name || item.name || '') + '</td>'
                + '<td class="text-center">' + item.quantity + '</td>'
                + '<td class="text-right">' + numberFormat(item.price) + ' ₫</td>'
                + '<td class="text-right">' + numberFormat(item.subtotal || (item.price * item.quantity)) + ' ₫</td></tr>';
        });

        $('#modal-order-body').html(
            '<div class="row mb-3">'
            + '<div class="col-6"><strong>Khách hàng:</strong><br>' + escHtml(o.fullname || '') + '</div>'
            + '<div class="col-6"><strong>Điện thoại:</strong><br>' + escHtml(o.phone || '') + '</div>'
            + '</div>'
            + '<div class="mb-3"><strong>Địa chỉ:</strong> ' + escHtml(o.address || '') + '</div>'
            + (o.note ? '<div class="mb-3"><strong>Ghi chú:</strong> ' + escHtml(o.note) + '</div>' : '')
            + '<table class="table table-sm table-bordered mb-3">'
            + '<thead class="thead-light"><tr><th>Sản phẩm</th><th class="text-center">SL</th><th class="text-right">Giá</th><th class="text-right">Thành tiền</th></tr></thead>'
            + '<tbody>' + itemsHtml + '</tbody>'
            + '</table>'
            + '<div class="text-right"><strong>Tổng cộng: <span style="color:#d70018;">' + numberFormat(o.total_amount) + ' ₫</span></strong></div>'
        );
    });
}
</script>
</body>
</html>
