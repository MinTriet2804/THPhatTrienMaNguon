<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập — TechStore</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="header-placeholder"></div>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="text-center mb-4">
            <div style="font-size:2.5rem;color:#d70018;"><i class="fas fa-user-circle"></i></div>
            <h2>Đăng nhập</h2>
            <p class="auth-subtitle">Chào mừng trở lại TechStore!</p>
        </div>

        <div id="login-alert" style="display:none;" class="alert alert-danger"></div>

        <form id="login-form">
            <div class="form-group">
                <label class="font-weight-bold">Tên đăng nhập</label>
                <div class="input-group">
                    <div class="input-group-prepend">
                        <span class="input-group-text"><i class="fas fa-user text-muted"></i></span>
                    </div>
                    <input type="text" id="username" class="form-control" placeholder="Nhập username..." required>
                </div>
            </div>

            <div class="form-group">
                <label class="font-weight-bold">Mật khẩu</label>
                <div class="input-group">
                    <div class="input-group-prepend">
                        <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
                    </div>
                    <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu..." required>
                    <div class="input-group-append">
                        <button type="button" class="btn btn-outline-secondary" id="toggle-pwd">
                            <i class="fas fa-eye" id="eye-icon"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <small><a href="forgot-password.html" class="text-danger">Quên mật khẩu?</a></small>
            </div>

            <button type="submit" id="btn-login" class="btn-primary-red">
                <i class="fas fa-sign-in-alt mr-2"></i> Đăng nhập
            </button>
        </form>

        <hr class="my-4">
        <p class="text-center text-muted mb-0" style="font-size:0.9rem;">
            Chưa có tài khoản?
            <a href="register.html" class="text-danger font-weight-bold">Đăng ký ngay</a>
        </p>
    </div>
</div>

<div id="footer-placeholder"></div>
<div id="toast-container"></div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/components.js"></script>
<script>
$(document).ready(function () {
    // Nếu đã đăng nhập rồi thì về trang chủ
    if (Auth.isLoggedIn()) window.location.href = 'index.html';

    Components.loadHeader();
    Components.loadFooter();

    // Toggle hiện/ẩn mật khẩu
    $('#toggle-pwd').on('click', function () {
        var input = $('#password');
        var icon  = $('#eye-icon');
        if (input.attr('type') === 'password') {
            input.attr('type', 'text');
            icon.removeClass('fa-eye').addClass('fa-eye-slash');
        } else {
            input.attr('type', 'password');
            icon.removeClass('fa-eye-slash').addClass('fa-eye');
        }
    });

    // Submit form đăng nhập
    $('#login-form').on('submit', function (e) {
        e.preventDefault();

        var username = $.trim($('#username').val());
        var password = $('#password').val();

        if (!username || !password) {
            showError('Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu.');
            return;
        }

        var btn = $('#btn-login');
        btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin mr-2"></i>Đang đăng nhập...');
        $('#login-alert').hide();

        // Gọi API đăng nhập — F12 > Network > Fetch/XHR sẽ thấy request này
        API.post('/api/auth/login', { username: username, password: password })
            .done(function (res) {
                if (res.success) {
                    // Lưu JWT token vào localStorage
                    Auth.save(res.data.token, res.data.user);
                    Toast.success('Đăng nhập thành công! Xin chào ' + res.data.user.fullname);
                    setTimeout(function () { window.location.href = 'index.html'; }, 800);
                } else {
                    showError(res.message || 'Đăng nhập thất bại.');
                    btn.prop('disabled', false).html('<i class="fas fa-sign-in-alt mr-2"></i> Đăng nhập');
                }
            })
            .fail(function (xhr) {
                var msg = (xhr.responseJSON && xhr.responseJSON.message)
                    ? xhr.responseJSON.message : 'Lỗi kết nối. Kiểm tra lại server.';
                showError(msg);
                btn.prop('disabled', false).html('<i class="fas fa-sign-in-alt mr-2"></i> Đăng nhập');
            });
    });

    function showError(msg) {
        $('#login-alert').html('<i class="fas fa-exclamation-circle mr-2"></i>' + escHtml(msg)).show();
    }
});
</script>
</body>
</html>
