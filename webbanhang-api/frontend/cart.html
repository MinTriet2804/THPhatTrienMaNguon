<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng — TechStore</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="header-placeholder"></div>

<div class="container-fluid px-md-5 main-content">
    <div class="d-flex align-items-center justify-content-between mb-4 mt-3">
        <h1 class="cps-title mb-0"><i class="fas fa-shopping-cart"></i> Giỏ hàng</h1>
        <button id="btn-clear-cart" class="btn btn-sm btn-outline-danger" style="display:none;">
            <i class="fas fa-trash"></i> Xóa toàn bộ
        </button>
    </div>

    <div id="cart-loading" class="text-center py-5">
        <div class="spinner-border text-danger"></div><p class="mt-2 text-muted">Đang tải giỏ hàng...</p>
    </div>

    <div id="cart-empty" style="display:none;" class="text-center p-5 bg-white rounded">
        <i class="fas fa-shopping-cart fa-3x text-muted mb-3"></i>
        <p class="text-muted">Giỏ hàng của bạn đang trống.</p>
        <a href="index.html" class="btn-primary-red" style="display:inline-block;width:auto;padding:10px 28px;border-radius:8px;text-decoration:none;">
            <i class="fas fa-store mr-2"></i>Tiếp tục mua sắm
        </a>
    </div>

    <div id="cart-content" style="display:none;">
        <div class="row">
            <!-- Bảng giỏ hàng -->
            <div class="col-lg-8">
                <div class="page-card">
                    <table class="table table-borderless" id="cart-table">
                        <thead>
                            <tr style="border-bottom:2px solid #f1f3f5;">
                                <th>Sản phẩm</th>
                                <th class="text-center">Giá</th>
                                <th class="text-center">Số lượng</th>
                                <th class="text-center">Thành tiền</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="cart-items"></tbody>
                    </table>
                </div>
            </div>
            <!-- Tổng tiền -->
            <div class="col-lg-4">
                <div class="cart-total-box">
                    <h5 class="font-weight-700 mb-4" style="color:#222;">Tóm tắt đơn hàng</h5>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Tạm tính:</span>
                        <strong id="subtotal-val">0 ₫</strong>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Phí vận chuyển:</span>
                        <strong id="shipping-val">30.000 ₫</strong>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between mb-4">
                        <span class="font-weight-700">Tổng cộng:</span>
                        <strong style="color:#d70018;font-size:1.2rem;" id="total-val">0 ₫</strong>
                    </div>
                    <a href="checkout.html" id="btn-checkout" class="btn-primary-red" style="display:block;text-align:center;text-decoration:none;padding:12px;border-radius:8px;">
                        <i class="fas fa-credit-card mr-2"></i>Tiến hành đặt hàng
                    </a>
                    <a href="index.html" class="btn btn-outline-secondary btn-block mt-2">
                        <i class="fas fa-arrow-left mr-2"></i>Tiếp tục mua sắm
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="footer-placeholder"></div>
<div id="toast-container"></div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/components.js"></script>
<script>
$(document).ready(function () {
    if (!Auth.requireLogin()) return;
    Components.loadHeader();
    Components.loadFooter();
    loadCart();

    // Xóa toàn bộ giỏ
    $('#btn-clear-cart').on('click', function () {
        if (!confirm('Xóa toàn bộ giỏ hàng?')) return;
        API.authDelete('/api/cart').done(function (res) {
            if (res.success) { Toast.success('Đã xóa giỏ hàng.'); loadCart(); }
        });
    });
});

function loadCart() {
    $('#cart-loading').show();
    $('#cart-content, #cart-empty').hide();

    API.authGet('/api/cart').done(function (res) {
        $('#cart-loading').hide();
        if (!res.success || !res.data.items || res.data.items.length === 0) {
            $('#cart-empty').show();
            Components.updateCartBadge(0);
            return;
        }
        renderCart(res.data);
    }).fail(function () {
        $('#cart-loading').hide();
        Toast.error('Không thể tải giỏ hàng.');
    });

    // Lấy tổng tiền kèm phí ship
    API.authGet('/api/cart/total').done(function (res) {
        if (res.success && res.data) {
            var d = res.data;
            $('#subtotal-val').text(numberFormat(d.subtotal) + ' ₫');
            $('#shipping-val').text(d.shipping_fee === 0 ? 'Miễn phí' : numberFormat(d.shipping_fee) + ' ₫');
            $('#total-val').text(numberFormat(d.grand_total) + ' ₫');
            Components.updateCartBadge(d.item_count);
        }
    });
}

function renderCart(data) {
    var tbody = $('#cart-items').empty();
    $.each(data.items, function (i, item) {
        var imgHtml = item.image
            ? '<img src="' + API.imgUrl(item.image) + '" class="cart-item-img">'
            : '<div style="width:60px;height:60px;background:#f0f0f0;border-radius:6px;display:flex;align-items:center;justify-content:center;"><i class="fas fa-image text-muted"></i></div>';

        tbody.append(
            '<tr data-id="' + item.product_id + '">'
            + '<td><div class="d-flex align-items-center gap-3" style="gap:12px;">'
            + imgHtml
            + '<div><div class="font-weight-600">' + escHtml(item.name) + '</div></div></div></td>'
            + '<td class="text-center align-middle">' + numberFormat(item.price) + ' ₫</td>'
            + '<td class="text-center align-middle">'
            + '<div class="d-flex align-items-center justify-content-center" style="gap:6px;">'
            + '<button class="btn btn-sm btn-outline-secondary btn-qty-minus" data-id="' + item.product_id + '">−</button>'
            + '<input type="number" class="qty-input" value="' + item.quantity + '" min="1" max="99" data-id="' + item.product_id + '">'
            + '<button class="btn btn-sm btn-outline-secondary btn-qty-plus" data-id="' + item.product_id + '">+</button>'
            + '</div></td>'
            + '<td class="text-center align-middle font-weight-700" style="color:#d70018;">' + numberFormat(item.subtotal) + ' ₫</td>'
            + '<td class="text-center align-middle">'
            + '<button class="btn btn-sm btn-outline-danger btn-remove-item" data-id="' + item.product_id + '"><i class="fas fa-trash"></i></button>'
            + '</td></tr>'
        );
    });

    $('#cart-content').show();
    $('#btn-clear-cart').show();

    // Tăng/giảm số lượng
    $('#cart-items').off('click', '.btn-qty-minus').on('click', '.btn-qty-minus', function () {
        var id  = $(this).data('id');
        var input = $('input.qty-input[data-id="' + id + '"]');
        var qty = parseInt(input.val()) - 1;
        if (qty < 1) qty = 1;
        input.val(qty);
        updateQty(id, qty);
    });
    $('#cart-items').off('click', '.btn-qty-plus').on('click', '.btn-qty-plus', function () {
        var id  = $(this).data('id');
        var input = $('input.qty-input[data-id="' + id + '"]');
        var qty = parseInt(input.val()) + 1;
        input.val(qty);
        updateQty(id, qty);
    });
    $('#cart-items').off('change', '.qty-input').on('change', '.qty-input', function () {
        var id  = $(this).data('id');
        var qty = parseInt($(this).val());
        if (qty < 1) { $(this).val(1); qty = 1; }
        updateQty(id, qty);
    });

    // Xóa item
    $('#cart-items').off('click', '.btn-remove-item').on('click', '.btn-remove-item', function () {
        var id = $(this).data('id');
        API.authDelete('/api/cart/' + id).done(function (res) {
            if (res.success) { Toast.info('Đã xóa sản phẩm.'); loadCart(); }
        });
    });
}

function updateQty(productId, qty) {
    API.authPut('/api/cart/' + productId, { quantity: qty }).done(function (res) {
        if (res.success) {
            // Reload tổng tiền
            API.authGet('/api/cart/total').done(function (r) {
                if (r.success) {
                    var d = r.data;
                    $('#subtotal-val').text(numberFormat(d.subtotal) + ' ₫');
                    $('#shipping-val').text(d.shipping_fee === 0 ? 'Miễn phí' : numberFormat(d.shipping_fee) + ' ₫');
                    $('#total-val').text(numberFormat(d.grand_total) + ' ₫');
                    Components.updateCartBadge(d.item_count);
                }
            });
        }
    });
}
</script>
</body>
</html>
