<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu — TechStore</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="header-placeholder"></div>

<div class="container-fluid px-md-5 main-content">
<div class="row mt-3 justify-content-center">
    <div class="col-md-6">
        <div class="page-card">
            <h2 class="page-title"><i class="fas fa-key mr-2"></i>Đổi mật khẩu</h2>

            <div id="pwd-alert"   style="display:none;" class="alert alert-danger"></div>
            <div id="pwd-success" style="display:none;" class="alert alert-success"></div>

            <form id="change-pwd-form">
                <div class="form-group">
                    <label class="font-weight-bold">Mật khẩu hiện tại <span class="text-danger">*</span></label>
                    <input type="password" id="current_password" class="form-control" placeholder="Nhập mật khẩu hiện tại" required>
                </div>
                <div class="form-group">
                    <label class="font-weight-bold">Mật khẩu mới <span class="text-danger">*</span></label>
                    <input type="password" id="new_password" class="form-control" placeholder="Ít nhất 6 ký tự" required>
                </div>
                <div class="form-group">
                    <label class="font-weight-bold">Xác nhận mật khẩu mới <span class="text-danger">*</span></label>
                    <input type="password" id="confirm_password" class="form-control" placeholder="Nhập lại mật khẩu mới" required>
                </div>
                <div class="d-flex gap-2" style="gap:12px;">
                    <button type="submit" id="btn-change" class="btn-primary-red" style="width:auto;padding:10px 28px;">
                        <i class="fas fa-save mr-2"></i>Đổi mật khẩu
                    </button>
                    <a href="profile.html" class="btn btn-outline-secondary">Quay lại</a>
                </div>
            </form>
        </div>
    </div>
</div>
</div>

<div id="footer-placeholder"></div>
<div id="toast-container"></div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/components.js"></script>
<script>
$(document).ready(function () {
    if (!Auth.requireLogin()) return;
    Components.loadHeader();
    Components.loadFooter();

    $('#change-pwd-form').on('submit', function (e) {
        e.preventDefault();
        $('#pwd-alert, #pwd-success').hide();

        var data = {
            current_password:  $('#current_password').val(),
            new_password:      $('#new_password').val(),
            confirm_password:  $('#confirm_password').val(),
        };

        if (!data.current_password || !data.new_password || !data.confirm_password) {
            $('#pwd-alert').html('<i class="fas fa-exclamation-circle mr-2"></i>Vui lòng điền đầy đủ các trường.').show();
            return;
        }
        if (data.new_password.length < 6) {
            $('#pwd-alert').html('<i class="fas fa-exclamation-circle mr-2"></i>Mật khẩu mới ít nhất 6 ký tự.').show();
            return;
        }
        if (data.new_password !== data.confirm_password) {
            $('#pwd-alert').html('<i class="fas fa-exclamation-circle mr-2"></i>Mật khẩu xác nhận không khớp.').show();
            return;
        }

        var btn = $('#btn-change');
        btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin mr-2"></i>Đang xử lý...');

        API.authPost('/api/account/change-password', data)
            .done(function (res) {
                if (res.success) {
                    $('#pwd-success').html('<i class="fas fa-check-circle mr-2"></i>' + escHtml(res.message)).show();
                    $('#change-pwd-form')[0].reset();
                    Toast.success('Đổi mật khẩu thành công! Vui lòng đăng nhập lại.');
                    setTimeout(function () { Auth.clear(); window.location.href = 'login.html'; }, 2000);
                } else {
                    $('#pwd-alert').html('<i class="fas fa-exclamation-circle mr-2"></i>' + escHtml(res.message)).show();
                }
            })
            .fail(function (xhr) {
                var msg = xhr.responseJSON ? xhr.responseJSON.message : 'Lỗi kết nối.';
                $('#pwd-alert').html('<i class="fas fa-exclamation-circle mr-2"></i>' + escHtml(msg)).show();
            })
            .always(function () {
                btn.prop('disabled', false).html('<i class="fas fa-save mr-2"></i>Đổi mật khẩu');
            });
    });
});
</script>
</body>
</html>
