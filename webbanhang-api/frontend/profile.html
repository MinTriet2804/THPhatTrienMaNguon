<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ cá nhân — TechStore</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="header-placeholder"></div>

<div class="container-fluid px-md-5 main-content">
<div class="row mt-3">
    <!-- Sidebar -->
    <div class="col-md-3 mb-3">
        <div class="page-card text-center">
            <div style="font-size:4rem;color:#d70018;"><i class="fas fa-user-circle"></i></div>
            <h5 id="sidebar-name" class="font-weight-700 mt-2"></h5>
            <span id="sidebar-role" class="badge badge-danger"></span>
        </div>
        <div class="list-group mt-3" style="border-radius:10px;overflow:hidden;">
            <a href="profile.html" class="list-group-item list-group-item-action active" style="background:#d70018;border-color:#d70018;">
                <i class="fas fa-id-card mr-2"></i>Hồ sơ cá nhân
            </a>
            <a href="change-password.html" class="list-group-item list-group-item-action">
                <i class="fas fa-key mr-2"></i>Đổi mật khẩu
            </a>
            <a href="orders.html" class="list-group-item list-group-item-action">
                <i class="fas fa-clipboard-list mr-2"></i>Đơn hàng của tôi
            </a>
        </div>
    </div>

    <!-- Form hồ sơ -->
    <div class="col-md-9">
        <div class="page-card">
            <h2 class="page-title"><i class="fas fa-id-card mr-2"></i>Hồ sơ cá nhân</h2>

            <div id="profile-loading" class="text-center py-4">
                <div class="spinner-border text-danger"></div>
            </div>

            <form id="profile-form" style="display:none;">
                <div id="profile-alert" style="display:none;" class="alert alert-danger mb-3"></div>
                <div id="profile-success" style="display:none;" class="alert alert-success mb-3"></div>

                <div class="row">
                    <div class="col-md-6 form-group">
                        <label class="font-weight-bold">Tên đăng nhập</label>
                        <input type="text" id="username" class="form-control" disabled>
                        <small class="text-muted">Không thể thay đổi tên đăng nhập.</small>
                    </div>
                    <div class="col-md-6 form-group">
                        <label class="font-weight-bold">Quyền</label>
                        <input type="text" id="role" class="form-control" disabled>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 form-group">
                        <label class="font-weight-bold">Họ và tên <span class="text-danger">*</span></label>
                        <input type="text" id="fullname" class="form-control" required>
                        <div class="invalid-feedback" id="err-fullname"></div>
                    </div>
                    <div class="col-md-6 form-group">
                        <label class="font-weight-bold">Email <span class="text-danger">*</span></label>
                        <input type="email" id="email" class="form-control" required>
                        <div class="invalid-feedback" id="err-email"></div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 form-group">
                        <label class="font-weight-bold">Số điện thoại</label>
                        <input type="text" id="phone" class="form-control" placeholder="0901234567">
                        <div class="invalid-feedback" id="err-phone"></div>
                    </div>
                    <div class="col-md-6 form-group">
                        <label class="font-weight-bold">Địa chỉ</label>
                        <input type="text" id="address" class="form-control" placeholder="Số nhà, đường, quận, tỉnh">
                    </div>
                </div>

                <button type="submit" id="btn-save" class="btn-primary-red" style="width:auto;padding:10px 32px;">
                    <i class="fas fa-save mr-2"></i>Lưu thay đổi
                </button>
            </form>
        </div>
    </div>
</div>
</div>

<div id="footer-placeholder"></div>
<div id="toast-container"></div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/components.js"></script>
<script>
$(document).ready(function () {
    if (!Auth.requireLogin()) return;
    Components.loadHeader();
    Components.loadFooter();

    // Load thông tin profile từ API
    API.authGet('/api/account/profile').done(function (res) {
        $('#profile-loading').hide();
        if (!res.success) { Toast.error('Không tải được thông tin.'); return; }
        var u = res.data;
        $('#username').val(u.username);
        $('#role').val(u.role === 'admin' ? 'Admin' : 'Người dùng');
        $('#fullname').val(u.fullname);
        $('#email').val(u.email);
        $('#phone').val(u.phone || '');
        $('#address').val(u.address || '');
        $('#sidebar-name').text(u.fullname || u.username);
        $('#sidebar-role').text(u.role === 'admin' ? 'Admin' : 'User');
        $('#profile-form').show();
    }).fail(function () {
        $('#profile-loading').html('<p class="text-danger">Không thể tải hồ sơ. Vui lòng thử lại.</p>');
    });

    // Submit cập nhật profile
    $('#profile-form').on('submit', function (e) {
        e.preventDefault();
        clearErrors();

        var data = {
            fullname: $.trim($('#fullname').val()),
            email:    $.trim($('#email').val()),
            phone:    $.trim($('#phone').val()),
            address:  $.trim($('#address').val()),
        };

        var btn = $('#btn-save');
        btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin mr-2"></i>Đang lưu...');

        API.authPut('/api/account/profile', data)
            .done(function (res) {
                if (res.success) {
                    $('#profile-success').html('<i class="fas fa-check-circle mr-2"></i>Cập nhật hồ sơ thành công!').show();
                    Toast.success('Hồ sơ đã được cập nhật!');
                    // Cập nhật tên trong sidebar
                    $('#sidebar-name').text(res.data.fullname);
                } else {
                    if (res.errors) $.each(res.errors, function (k, v) { showFieldError(k, v); });
                    $('#profile-alert').html('<i class="fas fa-exclamation-circle mr-2"></i>' + escHtml(res.message)).show();
                }
            })
            .fail(function (xhr) {
                var r = xhr.responseJSON;
                if (r && r.errors) $.each(r.errors, function (k, v) { showFieldError(k, v); });
                $('#profile-alert').html('<i class="fas fa-exclamation-circle mr-2"></i>' + escHtml(r ? r.message : 'Lỗi kết nối.')).show();
            })
            .always(function () {
                btn.prop('disabled', false).html('<i class="fas fa-save mr-2"></i>Lưu thay đổi');
            });
    });

    function showFieldError(field, msg) {
        $('#' + field).addClass('is-invalid');
        $('#err-' + field).text(msg).show();
    }
    function clearErrors() {
        $('.form-control').removeClass('is-invalid');
        $('.invalid-feedback').hide();
        $('#profile-alert, #profile-success').hide();
    }
});
</script>
</body>
</html>
