<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký — TechStore</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="header-placeholder"></div>

<div class="auth-wrapper">
    <div class="auth-card" style="max-width:500px;">
        <div class="text-center mb-4">
            <div style="font-size:2.5rem;color:#d70018;"><i class="fas fa-user-plus"></i></div>
            <h2>Đăng ký</h2>
            <p class="auth-subtitle">Tạo tài khoản TechStore miễn phí</p>
        </div>

        <div id="register-alert" style="display:none;" class="alert alert-danger"></div>
        <div id="register-success" style="display:none;" class="alert alert-success"></div>

        <form id="register-form">
            <div class="form-group">
                <label class="font-weight-bold">Tên đăng nhập <span class="text-danger">*</span></label>
                <input type="text" id="username" class="form-control" placeholder="3-50 ký tự, chữ và số" required>
                <div class="invalid-feedback" id="err-username"></div>
            </div>

            <div class="form-group">
                <label class="font-weight-bold">Họ và tên <span class="text-danger">*</span></label>
                <input type="text" id="fullname" class="form-control" placeholder="Nguyễn Văn A" required>
                <div class="invalid-feedback" id="err-fullname"></div>
            </div>

            <div class="form-group">
                <label class="font-weight-bold">Email <span class="text-danger">*</span></label>
                <input type="email" id="email" class="form-control" placeholder="example@email.com" required>
                <div class="invalid-feedback" id="err-email"></div>
            </div>

            <div class="form-group">
                <label class="font-weight-bold">Mật khẩu <span class="text-danger">*</span></label>
                <div class="input-group">
                    <input type="password" id="password" class="form-control" placeholder="Ít nhất 6 ký tự" required>
                    <div class="input-group-append">
                        <button type="button" class="btn btn-outline-secondary" id="toggle-pwd">
                            <i class="fas fa-eye" id="eye-icon"></i>
                        </button>
                    </div>
                </div>
                <div class="invalid-feedback" id="err-password"></div>
            </div>

            <div class="form-group">
                <label class="font-weight-bold">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                <input type="password" id="confirm_password" class="form-control" placeholder="Nhập lại mật khẩu" required>
                <div class="invalid-feedback" id="err-confirm"></div>
            </div>

            <button type="submit" id="btn-register" class="btn-primary-red">
                <i class="fas fa-user-plus mr-2"></i> Tạo tài khoản
            </button>
        </form>

        <hr class="my-4">
        <p class="text-center text-muted mb-0" style="font-size:0.9rem;">
            Đã có tài khoản? <a href="login.html" class="text-danger font-weight-bold">Đăng nhập</a>
        </p>
    </div>
</div>

<div id="footer-placeholder"></div>
<div id="toast-container"></div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/components.js"></script>
<script>
$(document).ready(function () {
    if (Auth.isLoggedIn()) window.location.href = 'index.html';

    Components.loadHeader();
    Components.loadFooter();

    $('#toggle-pwd').on('click', function () {
        var input = $('#password');
        var icon  = $('#eye-icon');
        if (input.attr('type') === 'password') {
            input.attr('type', 'text'); icon.removeClass('fa-eye').addClass('fa-eye-slash');
        } else {
            input.attr('type', 'password'); icon.removeClass('fa-eye-slash').addClass('fa-eye');
        }
    });

    $('#register-form').on('submit', function (e) {
        e.preventDefault();
        clearErrors();

        var data = {
            username:         $.trim($('#username').val()),
            fullname:         $.trim($('#fullname').val()),
            email:            $.trim($('#email').val()),
            password:         $('#password').val(),
            confirm_password: $('#confirm_password').val(),
        };

        var valid = true;
        if (!data.username) { showFieldError('username', 'Tên đăng nhập không được để trống.'); valid = false; }
        if (!data.fullname) { showFieldError('fullname', 'Họ tên không được để trống.'); valid = false; }
        if (!data.email)    { showFieldError('email', 'Email không được để trống.'); valid = false; }
        if (data.password.length < 6) { showFieldError('password', 'Mật khẩu ít nhất 6 ký tự.'); valid = false; }
        if (data.password !== data.confirm_password) { showFieldError('confirm', 'Mật khẩu xác nhận không khớp.'); valid = false; }
        if (!valid) return;

        var btn = $('#btn-register');
        btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin mr-2"></i>Đang đăng ký...');

        API.post('/api/auth/register', data)
            .done(function (res) {
                if (res.success) {
                    $('#register-form').hide();
                    $('#register-success').html(
                        '<i class="fas fa-check-circle mr-2"></i>'
                        + '<strong>Đăng ký thành công!</strong> Chuyển hướng đến trang đăng nhập...'
                    ).show();
                    setTimeout(function () { window.location.href = 'login.html'; }, 2000);
                } else {
                    if (res.errors) {
                        $.each(res.errors, function (k, v) { showFieldError(k, v); });
                    }
                    $('#register-alert').html('<i class="fas fa-exclamation-circle mr-2"></i>' + escHtml(res.message)).show();
                    btn.prop('disabled', false).html('<i class="fas fa-user-plus mr-2"></i> Tạo tài khoản');
                }
            })
            .fail(function (xhr) {
                var msg = xhr.responseJSON ? xhr.responseJSON.message : 'Lỗi kết nối.';
                if (xhr.responseJSON && xhr.responseJSON.errors) {
                    $.each(xhr.responseJSON.errors, function (k, v) { showFieldError(k, v); });
                }
                $('#register-alert').html('<i class="fas fa-exclamation-circle mr-2"></i>' + escHtml(msg)).show();
                btn.prop('disabled', false).html('<i class="fas fa-user-plus mr-2"></i> Tạo tài khoản');
            });
    });

    function showFieldError(field, msg) {
        var input = $('#' + field);
        input.addClass('is-invalid');
        $('#err-' + field).text(msg).show();
    }
    function clearErrors() {
        $('.form-control').removeClass('is-invalid');
        $('.invalid-feedback').hide();
        $('#register-alert, #register-success').hide();
    }
});
</script>
</body>
</html>
